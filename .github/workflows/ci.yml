name: CI

on:
  pull_request:
  push:
    branches:
      - "master"
      - "main"
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax check - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Syntax check
        run: find tests -name '*.php' -exec php -l {} + | grep -v "No syntax errors"  || true
